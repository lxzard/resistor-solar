name: Solar Collector Automation

on:
  schedule:
    - cron: '30 18,0,6,12 * * *'
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin

      - name: Create serviceAccountKey.json from GitHub Secret
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > serviceAccountKey.json

      - name: Check files in directory (Debug)
        run: |
          ls -la

      - name: Run collector script
        run: |
          python collector-v2.py
