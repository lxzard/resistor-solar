name: Solar Collector Automation

on:
  schedule:
    # KST 기준 03:30, 09:30, 15:30, 21:30
    # GitHub Actions의 cron은 UTC 기준으로 동작하므로 KST 대비 9시간을 뺌
    # KST 03:30 -> UTC 18:30 (전날)
    # KST 09:30 -> UTC 00:30
    # KST 15:30 -> UTC 06:30
    # KST 21:30 -> UTC 12:30
    - cron: '30 18,0,6,12 * * *'
  
  # 수동으로도 실행할 수 있도록 설정 (테스트용)
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 사용하는 파이썬 버전에 맞게 조절

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin

      - name: Create serviceAccountKey.json from GitHub Secret
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > serviceAccountKey.json

      - name: Run collector script
        run: |
          python collector-v2.py